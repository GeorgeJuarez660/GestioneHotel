<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modifica bevanda - Gestionale Hotel</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/updateBevandaCSS.css}">
</head>
<body>

<header class="brandbar">
  <div class="brandbar__mark">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-brass)">
      <circle cx="8" cy="14" r="3"></circle>
      <path d="M10.5 11.5 L20 2 M16.2 6.3 L18.3 8.4 M13.4 9.1 L15 10.7"></path>
    </svg>
    Gestionale Hotel
  </div>
  <a class="brandbar__back" th:href="@{/hotel/dipendente/bevande}">&larr; Torna alle bevande</a>
</header>

<main class="manage-shell" style="max-width:560px;">

  <div class="dashboard-header">
    <div>
      <span class="card__eyebrow">Area Dipendente</span>
      <h1 class="card__title" style="font-size:1.8rem;">Modifica bevanda</h1>
      <p class="dashboard-header__welcome" id="messaggioCodice"></p>
    </div>
  </div>

  <section class="panel">
    <div class="panel__header">
      <h2 class="panel__title">Dati della bevanda</h2>
    </div>
    <hr class="divider-brass">

    <div id="esito" class="esito" hidden></div>

    <form id="formBevanda" onsubmit="gestisciModifica(event)">
      <div class="field">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" maxlength="255" placeholder="Es. Champagne" required>
        <span class="hint">Puoi cambiarlo: il nome originale viene inviato a parte.</span>
      </div>
      <div class="field">
        <label for="quantitaBase">Quantita' base</label>
        <input type="number" id="quantitaBase" name="quantitaBase" min="0" placeholder="Es. 1" required>
      </div>
      <div class="field">
        <label for="prezzoBase">Prezzo base</label>
        <input type="number" id="prezzoBase" name="prezzoBase" min="0" step="0.01" placeholder="Es. 45.00" required>
        <span class="hint">Non puo' essere negativo.</span>
      </div>

      <div class="check-row">
        <input type="checkbox" id="alcolico" name="alcolico">
        <label for="alcolico">Alcolico</label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block" id="btnSubmit">Salva modifiche</button>
        <p class="link-row"><a th:href="@{/hotel/dipendente/bevande}">&larr; Torna all'elenco delle bevande</a></p>
      </div>
    </form>
  </section>

</main>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/updateBevandaJS.js}"></script>

</body>
</html>
