<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestionale Hotel</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<style>
  /*
    Sfondo diviso a meta': sopra la foto dell'hotel, sotto l'ink navy
    gia' usato dalle altre pagine (var(--color-ink) di style.css).
  */
  .dashboard-hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .dashboard-hero__bg {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .dashboard-hero__bg::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 50%;
    background-image: url('https://images.unsplash.com/photo-1571896349842-33c89424de2d?w=1600&q=80');
    background-size: cover;
    background-position: center;
  }

  .dashboard-hero__bg::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--color-ink);
  }

  /* Velatura sulla foto: tiene leggibile il testo e sfuma la giunzione */
  .dashboard-hero__scrim {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
      to bottom,
      rgba(15, 22, 33, 0.72) 0%,
      rgba(15, 22, 33, 0.45) 28%,
      rgba(15, 22, 33, 0.85) 46%,
      var(--color-ink) 54%
    );
  }

  .dashboard-hero > .brandbar,
  .dashboard-hero__body {
    position: relative;
    z-index: 2;
  }

  .dashboard-hero > .brandbar {
    border-bottom-color: rgba(242, 237, 226, 0.18);
  }

  .dashboard-hero__body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 1.5rem 4rem;
    gap: 1.75rem;
  }

  .dashboard-hero__title {
    font-family: var(--font-display);
    font-size: clamp(2.1rem, 5vw, 3.2rem);
    line-height: 1.15;
    margin: 0;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
  }

  .dashboard-hero__lead {
    max-width: 46ch;
    margin: 0;
    color: var(--color-ivory-dim);
    font-size: 1rem;
  }

  .dashboard-hero__actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1rem;
    margin-top: 0.5rem;
  }

  .dashboard-hero__actions .btn {
    min-width: 230px;
    padding: 0.9rem 1.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .dashboard-hero__esito {
    max-width: 460px;
    width: 100%;
  }

  @media (max-width: 640px) {
    .dashboard-hero__actions .btn {
      min-width: 100%;
    }
  }
</style>
</head>
<body>

<div class="dashboard-hero">

  <div class="dashboard-hero__bg" aria-hidden="true"></div>
  <div class="dashboard-hero__scrim" aria-hidden="true"></div>

  <header class="brandbar">
    <div class="brandbar__mark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-brass)">
        <circle cx="8" cy="14" r="3"></circle>
        <path d="M10.5 11.5 L20 2 M16.2 6.3 L18.3 8.4 M13.4 9.1 L15 10.7"></path>
      </svg>
      Gestionale Hotel
    </div>
  </header>

  <main class="dashboard-hero__body">

    <span class="card__eyebrow">Benvenuto</span>
    <h1 class="dashboard-hero__title">Il tuo soggiorno<br>comincia da qui</h1>
    <p class="dashboard-hero__lead">
      Accedi al gestionale per prenotare una stanza e i servizi dell'hotel,
      oppure dai un'occhiata come ospite senza registrarti.
    </p>

    <div class="dashboard-hero__actions">
      <button type="button" class="btn btn-primary" id="btnLogin">Login</button>
      <button type="button" class="btn btn-secondary" id="btnOspite">Entra come ospite</button>
    </div>

    <div id="esito" class="esito dashboard-hero__esito" hidden></div>

  </main>

</div>

<script th:src="@{/js/common.js}"></script>
<script>
  const PAGINA_LOGIN = API_BASE + '/choose-register-login';
  const PAGINA_OSPITE = API_BASE + '/homepage/cliente/';

  const esito = document.getElementById('esito');
  const btnLogin = document.getElementById('btnLogin');
  const btnOspite = document.getElementById('btnOspite');

  /*
   * Prima di spostarsi si interroga l'endpoint con una fetch: se il server
   * risponde male si mostra l'errore qui, invece di lasciare l'utente su una
   * pagina di errore del browser.
   */
  async function vaiA(percorso, bottone) {
    nascondiEsito(esito);
    bottone.disabled = true;

    try {
      const response = await fetch(percorso, {
        method: 'GET',
        headers: { 'Accept': 'text/html' }
      });

      if (response.ok) {
        window.location.href = percorso;
        return;
      }

      const corpo = await leggiCorpoRisposta(response);
      mostraEsito(esito, corpo || 'Pagina non raggiungibile. Riprova piu tardi.', 'error');
    } catch (errore) {
      mostraEsito(esito, 'Impossibile contattare il server. Riprova piu tardi.', 'error');
    }

    bottone.disabled = false;
  }

  btnLogin.addEventListener('click', function () {
    vaiA(PAGINA_LOGIN, btnLogin);
  });

  // Accesso come ospite: nessun token richiesto, la homepage cliente gestisce
  // gia' il caso "nessun accesso effettuato".
  btnOspite.addEventListener('click', function () {
    vaiA(PAGINA_OSPITE, btnOspite);
  });
</script>

</body>
</html>
