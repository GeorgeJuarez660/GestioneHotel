<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lascia un feedback - Gestionale Hotel</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/insertFeedbackCSS.css}">
</head>
<body>

<header class="brandbar">
  <div class="brandbar__mark">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-brass)">
      <circle cx="8" cy="14" r="3"></circle>
      <path d="M10.5 11.5 L20 2 M16.2 6.3 L18.3 8.4 M13.4 9.1 L15 10.7"></path>
    </svg>
    Gestionale Hotel
  </div>
  <a class="brandbar__back" th:href="@{/hotel/homepage/cliente/}">&larr; Torna al pannello</a>
</header>

<main class="page-shell">
  <div class="stack">
    <section class="card">
      <div class="card__icon" style="width:52px;height:52px;border-radius:50%;border:1px solid var(--color-brass-dim);display:flex;align-items:center;justify-content:center;color:var(--color-brass);margin-bottom:1.1rem;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15 9 22 9.5 16.5 14 18.5 21 12 17 5.5 21 7.5 14 2 9.5 9 9"></polygon>
        </svg>
      </div>
      <span class="card__eyebrow">Area Cliente</span>
      <h1 class="card__title">Lascia un feedback</h1>
      <hr class="divider-brass">

      <div id="esito" class="esito" hidden></div>

      <form id="formFeedback" onsubmit="gestisciInserimento(event)">
        <div class="field">
          <label for="note">Il tuo commento</label>
          <textarea id="note" name="note" maxlength="2000" placeholder="Raccontaci com'e' andato il soggiorno" required></textarea>
          <span class="hint">Massimo 2000 caratteri.</span>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block" id="btnSubmit">Invia feedback</button>
          <p class="link-row"><a th:href="@{/hotel/homepage/cliente/}">&larr; Torna al pannello cliente</a></p>
        </div>
      </form>
    </section>
  </div>
</main>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/insertFeedbackJS.js}"></script>

</body>
</html>
