<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione stanze - Gestionale Hotel</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="brandbar">
  <div class="brandbar__mark">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-brass)">
      <circle cx="8" cy="14" r="3"></circle>
      <path d="M10.5 11.5 L20 2 M16.2 6.3 L18.3 8.4 M13.4 9.1 L15 10.7"></path>
    </svg>
    Gestionale Hotel
  </div>
  <a class="brandbar__back" th:href="@{/hotel/homepage/dipendente/}">&larr; Torna al pannello</a>
</header>

<main class="manage-shell">

  <div class="dashboard-header">
    <div>
      <span class="card__eyebrow">Area Dipendente</span>
      <h1 class="card__title" style="font-size:1.8rem;">Gestione stanze</h1>
      <p class="dashboard-header__welcome">Inserisci una nuova stanza e consulta quelle gia' registrate.</p>
    </div>
  </div>

  <div class="manage-grid">

    <section class="panel">
      <div class="panel__header">
        <h2 class="panel__title">Nuova stanza</h2>
      </div>
      <hr class="divider-brass">

      <div id="esito" class="esito" hidden></div>

      <form id="formStanza" onsubmit="gestisciInserimento(event)">
        <div class="field">
          <label for="codice">Codice</label>
          <input type="text" id="codice" name="codice" maxlength="50" placeholder="Es. ST-101" required>
        </div>
        <div class="field">
          <label for="tipoStanza">Tipo stanza</label>
          <select id="tipoStanza" name="tipoStanza" required>
            <option value="SINGOLA">Singola</option>
            <option value="DOPPIA">Doppia</option>
            <option value="TRIPLA">Tripla</option>
            <option value="FAMILIARE">Per famiglie</option>
            <option value="MATRIMONIALE">Matrimoniale</option>
          </select>
        </div>
        <div class="field">
          <label for="capienza">Capienza</label>
          <input type="number" id="capienza" name="capienza" min="1" step="1" placeholder="Es. 2" required>
        </div>
        <div class="field">
          <label for="piano">Piano</label>
          <input type="number" id="piano" name="piano" step="1" placeholder="Es. 1" required>
        </div>
        <div class="field">
          <label for="prezzoBase">Prezzo base</label>
          <input type="number" id="prezzoBase" name="prezzoBase" min="0" step="0.01" placeholder="Es. 89.90" required>
        </div>
        <div class="field">
          <label for="termoregolabile">Termoregolabile</label>
          <select id="termoregolabile" name="termoregolabile" required>
            <option value="false">No</option>
            <option value="true">Si</option>
          </select>
        </div>
        <div class="field">
          <label for="note">Note</label>
          <input type="text" id="note" name="note" maxlength="1000" placeholder="Facoltative">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block" id="btnSubmit">Aggiungi stanza</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="panel__header">
        <h2 class="panel__title">Stanze registrate</h2>
        <button type="button" class="btn btn-secondary btn-small" id="btnAggiorna">Aggiorna elenco</button>
      </div>
      <hr class="divider-brass">

      <div id="esitoElenco" class="esito" hidden></div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Codice</th>
              <th>Tipo</th>
              <th>Capienza</th>
              <th>Piano</th>
              <th>Prezzo base</th>
              <th>Termoreg.</th>
              <th>Note</th>
              <th>Azioni</th>
            </tr>
          </thead>
          <tbody id="corpoTabella">
            <tr><td class="data-table__empty" colspan="8">Caricamento in corso...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

</main>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/setStanzeJS.js}"></script>

</body>
</html>
