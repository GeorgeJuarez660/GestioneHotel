<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modifica guida - Gestionale Hotel</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="brandbar">
  <div class="brandbar__mark">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-brass)">
      <circle cx="8" cy="14" r="3"></circle>
      <path d="M10.5 11.5 L20 2 M16.2 6.3 L18.3 8.4 M13.4 9.1 L15 10.7"></path>
    </svg>
    Gestionale Hotel
  </div>
  <a class="brandbar__back" th:href="@{/hotel/dipendente/guida}">&larr; Torna alle guide</a>
</header>

<main class="manage-shell" style="max-width:560px;">

  <div class="dashboard-header">
    <div>
      <span class="card__eyebrow">Area Dipendente</span>
      <h1 class="card__title" style="font-size:1.8rem;">Modifica guida</h1>
      <p class="dashboard-header__welcome" id="messaggioCodice"></p>
    </div>
  </div>

  <section class="panel">
    <div class="panel__header">
      <h2 class="panel__title">Dati della visita</h2>
    </div>
    <hr class="divider-brass">

    <div id="esito" class="esito" hidden></div>

    <form id="formGuida" onsubmit="gestisciModifica(event)">
      <div class="field">
        <label for="codice">Codice</label>
        <input type="text" id="codice" name="codice" maxlength="255" placeholder="Es. GUI-01" required>
        <span class="hint">Puoi cambiarlo: il codice originale viene inviato a parte.</span>
      </div>
      <div class="field">
        <label for="data">Data</label>
        <input type="date" id="data" name="data" required>
        <span class="hint">Non puo' essere una data passata.</span>
      </div>
      <div class="field">
        <label for="ora">Ora</label>
        <input type="time" id="ora" name="ora" required>
      </div>
      <div class="field">
        <label for="luogo">Luogo</label>
        <input type="text" id="luogo" name="luogo" maxlength="255" placeholder="Es. Centro storico" required>
      </div>
      <div class="field">
        <label for="cfOperatoreInterno">Codice fiscale operatore interno</label>
        <input type="text" id="cfOperatoreInterno" name="cfOperatoreInterno" maxlength="16" placeholder="Facoltativo">
        <span class="hint">Guida interna: se non indicata si usa quella esterna.</span>
      </div>
      <div class="field">
        <label for="cfOperatoreEsterno">Codice fiscale operatore esterno</label>
        <input type="text" id="cfOperatoreEsterno" name="cfOperatoreEsterno" maxlength="16" placeholder="Facoltativo">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block" id="btnSubmit">Salva modifiche</button>
        <p class="link-row"><a th:href="@{/hotel/dipendente/guida}">&larr; Torna all'elenco delle visite</a></p>
      </div>
    </form>
  </section>

</main>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/updateGuidaJS.js}"></script>

</body>
</html>
