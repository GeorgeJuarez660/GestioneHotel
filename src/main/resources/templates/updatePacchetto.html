<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modifica pacchetto - Gestionale Hotel</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/updatePacchettoCSS.css}">
</head>
<body>

<header class="brandbar">
  <div class="brandbar__mark">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-brass)">
      <circle cx="8" cy="14" r="3"></circle>
      <path d="M10.5 11.5 L20 2 M16.2 6.3 L18.3 8.4 M13.4 9.1 L15 10.7"></path>
    </svg>
    Gestionale Hotel
  </div>
  <a class="brandbar__back" th:href="@{/hotel/dipendente/pacchetti}">&larr; Torna ai pacchetti</a>
</header>

<main class="manage-shell" style="max-width:560px;">

  <div class="dashboard-header">
    <div>
      <span class="card__eyebrow">Area Dipendente</span>
      <h1 class="card__title" style="font-size:1.8rem;">Modifica pacchetto</h1>
      <p class="dashboard-header__welcome" id="messaggioCodice"></p>
    </div>
  </div>

  <section class="panel">
    <div class="panel__header">
      <h2 class="panel__title">Dati del pacchetto</h2>
    </div>
    <hr class="divider-brass">

    <div id="esito" class="esito" hidden></div>

    <form id="formPacchetto" onsubmit="gestisciModifica(event)">
      <div class="field">
        <label for="tipoPensione">Tipo pensione</label>
        <select id="tipoPensione" name="tipoPensione" required>
          <option value="PERNOTTAMENTO">Solo pernottamento</option>
          <option value="BED_AND_BREAKFAST">Bed and breakfast</option>
          <option value="MEZZA_PENSIONE">Mezza pensione</option>
          <option value="PENSIONE_COMPLETA">Pensione completa</option>
        </select>
        <span class="hint">Puoi cambiarlo: il tipo originale viene inviato a parte.</span>
      </div>

      <span class="card__eyebrow" style="margin-top:1.2rem;">Servizi inclusi</span>

      <div class="check-row">
        <input type="checkbox" id="colazione" name="colazione">
        <label for="colazione">Colazione</label>
      </div>
      <div class="check-row">
        <input type="checkbox" id="navetta" name="navetta">
        <label for="navetta">Navetta</label>
      </div>
      <div class="check-row">
        <input type="checkbox" id="guida" name="guida">
        <label for="guida">Guida</label>
      </div>
      <div class="check-row">
        <input type="checkbox" id="piscina" name="piscina">
        <label for="piscina">Piscina</label>
      </div>
      <div class="check-row">
        <input type="checkbox" id="parcheggio" name="parcheggio">
        <label for="parcheggio">Parcheggio</label>
      </div>

      <span class="card__eyebrow" style="margin-top:1.2rem;">Supplemento del pacchetto</span>
      <div class="field">
        <label for="percentuale">Percentuale</label>
        <input type="number" id="percentuale" name="percentuale" min="0"  placeholder="Es. 8" required>
      </div>

      <span class="card__eyebrow" style="margin-top:1.2rem;">Dettagli del pacchetto</span>
      <div class="field">
        <label for="descrizione">Descrizione</label>
        <input type="text" id="descrizione" name="descrizione" maxlength="255" placeholder="Es. Pacchetto weekend" required>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block" id="btnSubmit">Salva modifiche</button>
        <p class="link-row"><a th:href="@{/hotel/dipendente/pacchetti}">&larr; Torna all'elenco dei pacchetti</a></p>
      </div>
    </form>
  </section>

</main>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/updatePacchettoJS.js}"></script>

</body>
</html>
