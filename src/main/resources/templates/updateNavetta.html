<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modifica navetta - Gestionale Hotel</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="brandbar">
  <div class="brandbar__mark">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-brass)">
      <circle cx="8" cy="14" r="3"></circle>
      <path d="M10.5 11.5 L20 2 M16.2 6.3 L18.3 8.4 M13.4 9.1 L15 10.7"></path>
    </svg>
    Gestionale Hotel
  </div>
  <a class="brandbar__back" th:href="@{/hotel/dipendente/navetta}">&larr; Torna alle navette</a>
</header>

<main class="manage-shell" style="max-width:560px;">

  <div class="dashboard-header">
    <div>
      <span class="card__eyebrow">Area Dipendente</span>
      <h1 class="card__title" style="font-size:1.8rem;">Modifica navetta</h1>
      <p class="dashboard-header__welcome" id="messaggioCodice"></p>
    </div>
  </div>

  <section class="panel">
    <div class="panel__header">
      <h2 class="panel__title">Dati della corsa</h2>
    </div>
    <hr class="divider-brass">

    <div id="esito" class="esito" hidden></div>

    <form id="formNavetta" onsubmit="gestisciModifica(event)">
      <div class="field">
        <label for="codice">Codice</label>
        <input type="text" id="codice" name="codice" maxlength="255" placeholder="Es. NAV-01" required>
        <span class="hint">Puoi cambiarlo: il codice originale viene inviato a parte.</span>
      </div>
      <div class="field">
        <label for="dataPartenza">Data di partenza</label>
        <input type="date" id="dataPartenza" name="dataPartenza" required>
        <span class="hint">Non puo' essere una data passata.</span>
      </div>
      <div class="field">
        <label for="oraPartenza">Ora di partenza</label>
        <input type="time" id="oraPartenza" name="oraPartenza" required>
      </div>
      <div class="field">
        <label for="luogoPartenza">Luogo di partenza</label>
        <input type="text" id="luogoPartenza" name="luogoPartenza" maxlength="255" placeholder="Es. Hotel" required>
      </div>
      <div class="field">
        <label for="luogoDestinazione">Luogo di destinazione</label>
        <input type="text" id="luogoDestinazione" name="luogoDestinazione" maxlength="255" placeholder="Es. Aeroporto" required>
      </div>
      <div class="field">
        <label for="numPostiMax">Numero di posti massimi</label>
        <input type="number" id="numPostiMax" name="numPostiMax" min="0" placeholder="Es. 25" required>
      </div>
      <div class="field">
        <label for="numPostiDisp">Numero di posti disponibili</label>
        <input type="number" id="numPostiDisp" name="numPostiDisp" min="0" placeholder="Es. 25" required>
      </div>
      <div class="field">
        <label for="cfOperatoreInterno">Codice fiscale operatore interno</label>
        <input type="text" id="cfOperatoreInterno" name="cfOperatoreInterno" maxlength="16" placeholder="Facoltativo">
        <span class="hint">Dipendente incaricato della corsa.</span>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block" id="btnSubmit">Salva modifiche</button>
        <p class="link-row"><a th:href="@{/hotel/dipendente/navetta}">&larr; Torna all'elenco delle corse</a></p>
      </div>
    </form>
  </section>

</main>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/updateNavettaJS.js}"></script>

</body>
</html>
